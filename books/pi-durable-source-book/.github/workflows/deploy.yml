name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.4
      MDBOOK_MERMAID_VERSION: 0.17.1
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: cargo install --version ${MDBOOK_VERSION} mdbook

      - name: Install mdbook-mermaid
        run: cargo install --version ${MDBOOK_MERMAID_VERSION} mdbook-mermaid

      - name: Build with mdBook
        run: mdbook build books/pi-durable-source-book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: books/pi-durable-source-book/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
