[book]
title = "pi-durable 源码进阶：读懂可持久化 Agent Harness"
authors = ["Javen.C"]
language = "zh"
src = "src"
description = "面向已掌握 Agent 基础概念的工程师，深入 pi-durable 源码，逐行讲解会话、可恢复任务、文档、工具、扩展与存储后端"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/vacat/pi-durable-source-book"
edit-url-template = "https://github.com/vacat/pi-durable-source-book/edit/main/{path}"
additional-css = ["theme/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 0

[preprocessor.mermaid]
command = "mdbook-mermaid"
